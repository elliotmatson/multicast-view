name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: echo "tag=${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}" >> "$GITHUB_OUTPUT"

      # Never ship a build whose tests did not pass.
      - name: Test
        run: swift test

      - name: Assemble MulticastView.app
        run: ./Scripts/make-app.sh

      # ditto, not zip: it preserves the executable bit and the bundle
      # structure, so the downloaded app actually launches.
      - name: Package
        run: |
          ditto -c -k --keepParent dist/MulticastView.app \
            "MulticastView-${{ steps.version.outputs.tag }}.zip"

      - name: Check the archive round-trips
        run: |
          rm -rf verify && mkdir verify
          ditto -x -k "MulticastView-${{ steps.version.outputs.tag }}.zip" verify
          test -x verify/MulticastView.app/Contents/MacOS/MulticastView
          plutil -lint verify/MulticastView.app/Contents/Info.plist
          test -f verify/MulticastView.app/Contents/Resources/AppIcon.icns
          echo "archive is a launchable bundle"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          # Notes live in the repo rather than in a heredoc here: a heredoc body
          # has to sit at column 0, which breaks out of the YAML block scalar and
          # makes the whole workflow unparseable.
          sed "s/MulticastView-VERSION.zip/MulticastView-$VERSION.zip/" \
            .github/release-notes.md > notes.md
          gh release create "$VERSION" \
            --title "MulticastView $VERSION" \
            --notes-file notes.md \
            "MulticastView-$VERSION.zip"
